<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 10px;
    }
    .container {
        max-width: 100%;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        max-height: 90vh;
        overflow-y: auto;
    }
    .header {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        padding: 20px;
        text-align: center;
    }
    .header h1 {
        font-size: 2em;
        margin-bottom: 5px;
        font-weight: 300;
    }
    .content {
        padding: 20px;
    }
    .section {
        margin-bottom: 20px;
    }
    .section h2 {
        color: #333;
        margin-bottom: 15px;
        font-size: 1.3em;
        border-bottom: 2px solid #4facfe;
        padding-bottom: 8px;
    }
    .setup-form {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
    }
    input[type="text"],
    select {
        width: 100%;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
    }
    input[type="text"]:focus,
    select:focus {
        outline: none;
        border-color: #4facfe;
    }
    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
        margin-top: 8px;
    }
    .checkbox-item {
        display: flex;
        align-items: center;
        padding: 8px;
        background: white;
        border-radius: 5px;
        border: 1px solid #ddd;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 13px;
    }
    .checkbox-item:hover {
        background: #f0f8ff;
        border-color: #4facfe;
    }
    .checkbox-item input[type="checkbox"] {
        margin-right: 8px;
        scale: 1.1;
    }
    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        margin: 3px;
    }
    .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }
    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }
    .quiz-container {
        display: none;
    }
    .question-card {
        background: white;
        border: 2px solid #f0f0f0;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
    }
    .question-card:hover {
        border-color: #4facfe;
        transform: translateY(-1px);
    }
    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .question-number {
        background: #4facfe;
        color: white;
        padding: 6px 12px;
        border-radius: 15px;
        font-weight: bold;
        font-size: 12px;
    }
    .score {
        color: #666;
        font-size: 12px;
    }
    .question-text {
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #333;
        font-weight: 500;
    }
    .options {
        display: grid;
        gap: 8px;
    }
    .option {
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        background: white;
        font-size: 14px;
    }
    .option:hover {
        border-color: #4facfe;
        background: #f0f8ff;
    }
    .option.selected {
        border-color: #4facfe;
        background: #4facfe;
        color: white;
    }
    .option.correct {
        border-color: #28a745;
        background: #28a745;
        color: white;
    }
    .option.incorrect {
        border-color: #dc3545;
        background: #dc3545;
        color: white;
    }
    .question-nav {
        text-align: center;
        margin-top: 20px;
    }
    .results {
        text-align: center;
        padding: 25px;
        background: #f8f9fa;
        border-radius: 10px;
        margin-top: 15px;
    }
    .results h3 {
        font-size: 1.8em;
        margin-bottom: 15px;
        color: #333;
    }
    .score-display {
        font-size: 2.5em;
        font-weight: bold;
        color: #4facfe;
        margin-bottom: 15px;
    }
    /* Mobile responsiveness */
    @media (max-width: 600px) {
        .checkbox-group {
            grid-template-columns: 1fr;
        }
        .header h1 {
            font-size: 1.5em;
        }
        .btn {
            padding: 8px 16px;
            font-size: 13px;
        }
    }
</style>
