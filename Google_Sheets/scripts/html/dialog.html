<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz d'apprentissage des langues</title>
    <?!= include('scripts/html/styles'); ?>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 Quiz d'apprentissage des langues</h1>
            <p>Testez vos connaissances en vocabulaire par chapitre</p>
        </div>
        <div class="content">
            <div class="setup-section">
                <div class="section">
                    <h2>📚 Configuration du quiz</h2>
                    <div class="setup-form">
                        <div class="form-group">
                            <label for="quizDirection">Sens du quiz :</label>
                            <select id="quizDirection">
                                <option value="both">Les deux sens (aléatoire)</option>
                                <option value="word-to-translation">Mot → Traduction</option>
                                <option value="translation-to-word">Traduction → Mot</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sélectionnez les chapitres :</label>
                            <div class="checkbox-group" id="chapterCheckboxes">
                                <? chapters.forEach(function(chapter) { ?>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="chapter_<?= chapter.id ?>" value="<?= chapter.id ?>">
                                    <label for="chapter_<?= chapter.id ?>">
                                        <?= chapter.nom ?>
                                    </label>
                                </div>
                                <? }); ?>
                            </div>
                        </div>
                        <button class="btn" onclick="startQuiz()">🚀 Lancer le quiz</button>
                        <button class="btn" onclick="selectAllChapters()">✅ Tout sélectionner</button>
                        <button class="btn" onclick="clearAllChapters()">❌ Tout désélectionner</button>
                    </div>
                </div>
            </div>
            <div class="quiz-container" id="quizContainer">
                <div class="section">
                    <h2 id="quizTitle">📝 Quiz en cours</h2>
                    <div id="questionContainer">
                        <!-- Les questions seront affichées ici -->
                    </div>
                    <div class="question-nav">
                        <button class="btn" onclick="submitQuiz()">📊 Soumettre le quiz</button>
                        <button class="btn" onclick="resetQuiz()">🔄 Nouveau quiz</button>
                    </div>
                </div>
            </div>
            <div class="results" id="resultsContainer" style="display: none;">
                <h3>🎉 Quiz terminé !</h3>
                <div class="score-display" id="finalScore">0%</div>
                <div id="scoreBreakdown"></div>
                <button class="btn" onclick="resetQuiz()">🔄 Refaire un quiz</button>
                <!-- <button class="btn" onclick="reviewAnswers()">👀 Revoir les réponses</button> -->
                <!-- <button class="btn" onclick="saveResults()">💾 Enregistrer dans la feuille</button> -->
            </div>
        </div>
    </div>
    <script>
        // Données provenant de Google Sheets
        const chapters = <?!= JSON.stringify(chapters) ?>;
        const allWords = <?!= JSON.stringify(words) ?>;
        const translations = <?!= JSON.stringify(translations) ?>;
        const languages = <?!= JSON.stringify(languages) ?>;
        console.log(allWords);
    </script>
    <?!= include('scripts/html/script.html') || 'FAILED TO INCLUDE' ?>
</body>
</html>
